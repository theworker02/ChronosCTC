[workspace]
resolver = "2"
members = [
    "crates/ctc-dag",
    "crates/ctc-kernel",
    "crates/ctc-compiler",
    "crates/ctc-pruner",
    "crates/ctc-bridge",
    "crates/ctc-gc",
    "crates/ctc-inspector",
    "crates/ctc-signal",
    "crates/ctc-oracle",
    "crates/ctc-mesh",
    "crates/ctc-ledger",
    "crates/ctc-agents",
    "crates/ctc-collapse",
    "crates/ctc-holo",
    "crates/ctc-entropy",
    "crates/ctc-genesis",
    "crates/ctc-horizon",
    "crates/ctc-cosmos",
    "crates/ctc-cli",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Cronos-CTC Systems Architecture"]
readme = "README.md"
repository = "https://github.com/Mloon25/cronos-ctc"
homepage = "https://github.com/Mloon25/cronos-ctc"
keywords = ["ctc", "chronal", "retrocausal", "fixed-point", "holography"]
categories = ["compilers", "science", "simulation"]

[workspace.dependencies]
ctc-dag = { path = "crates/ctc-dag" }
ctc-kernel = { path = "crates/ctc-kernel" }
ctc-compiler = { path = "crates/ctc-compiler" }
ctc-pruner = { path = "crates/ctc-pruner" }
ctc-bridge = { path = "crates/ctc-bridge" }
ctc-gc = { path = "crates/ctc-gc" }
ctc-inspector = { path = "crates/ctc-inspector" }
ctc-signal = { path = "crates/ctc-signal" }
ctc-oracle = { path = "crates/ctc-oracle" }
ctc-mesh = { path = "crates/ctc-mesh" }
ctc-ledger = { path = "crates/ctc-ledger" }
ctc-agents = { path = "crates/ctc-agents" }
ctc-collapse = { path = "crates/ctc-collapse" }
ctc-holo = { path = "crates/ctc-holo" }
ctc-entropy = { path = "crates/ctc-entropy" }
ctc-genesis = { path = "crates/ctc-genesis" }
ctc-horizon = { path = "crates/ctc-horizon" }
ctc-cosmos = { path = "crates/ctc-cosmos" }
thiserror = "2"
parking_lot = "0.12"
rayon = "1.10"
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
smallvec = "1.13"
rustc-hash = "2"
