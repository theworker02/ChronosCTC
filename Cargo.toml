[workspace]
resolver = "2"
members = [
    "crates/ctc-dag",
    "crates/ctc-kernel",
    "crates/ctc-compiler",
    "crates/ctc-pruner",
    "crates/ctc-bridge",
    "crates/ctc-gc",
    "crates/ctc-inspector",
    "crates/ctc-signal",
    "crates/ctc-oracle",
    "crates/ctc-mesh",
    "crates/ctc-ledger",
    "crates/ctc-agents",
    "crates/ctc-collapse",
    "crates/ctc-holo",
    "crates/ctc-entropy",
    "crates/ctc-genesis",
    "crates/ctc-horizon",
    "crates/ctc-cosmos",
    "crates/ctc-cli",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Cronos-CTC Systems Architecture"]
readme = "README.md"
repository = "https://github.com/Mloon25/cronos-ctc"
homepage = "https://mloon25.github.io/cronos-ctc/"
keywords = ["ctc", "chronal", "retrocausal", "fixed-point", "holography"]
categories = ["compilers", "science", "simulation"]

[workspace.dependencies]
# path + version required so `cargo publish` can resolve crates.io dependents
ctc-dag = { path = "crates/ctc-dag", version = "0.6.0" }
ctc-kernel = { path = "crates/ctc-kernel", version = "0.6.0" }
ctc-compiler = { path = "crates/ctc-compiler", version = "0.6.0" }
ctc-pruner = { path = "crates/ctc-pruner", version = "0.6.0" }
ctc-bridge = { path = "crates/ctc-bridge", version = "0.6.0" }
ctc-gc = { path = "crates/ctc-gc", version = "0.6.0" }
ctc-inspector = { path = "crates/ctc-inspector", version = "0.6.0" }
ctc-signal = { path = "crates/ctc-signal", version = "0.6.0" }
ctc-oracle = { path = "crates/ctc-oracle", version = "0.6.0" }
ctc-mesh = { path = "crates/ctc-mesh", version = "0.6.0" }
ctc-ledger = { path = "crates/ctc-ledger", version = "0.6.0" }
ctc-agents = { path = "crates/ctc-agents", version = "0.6.0" }
ctc-collapse = { path = "crates/ctc-collapse", version = "0.6.0" }
ctc-holo = { path = "crates/ctc-holo", version = "0.6.0" }
ctc-entropy = { path = "crates/ctc-entropy", version = "0.6.0" }
ctc-genesis = { path = "crates/ctc-genesis", version = "0.6.0" }
ctc-horizon = { path = "crates/ctc-horizon", version = "0.6.0" }
ctc-cosmos = { path = "crates/ctc-cosmos", version = "0.6.0" }
thiserror = "2"
parking_lot = "0.12"
rayon = "1.10"
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
smallvec = "1.13"
rustc-hash = "2"
