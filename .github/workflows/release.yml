name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build -p ctc-cli --release

      - name: Package artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGE="cronos-ctc-${TAG}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${STAGE}"
          cp target/release/cronos-ctc "dist/${STAGE}/"
          cp README.md LICENSE CHANGELOG.md assets/logo.svg assets/logo.png "dist/${STAGE}/"
          if [ -f "releases/${TAG}/RELEASE_NOTES.md" ]; then
            cp "releases/${TAG}/RELEASE_NOTES.md" "dist/${STAGE}/"
          fi
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          (cd dist && sha256sum "${STAGE}.tar.gz" > SHA256SUMS)

      - name: Resolve release notes
        id: notes
        run: |
          if [ -f "releases/${GITHUB_REF_NAME}/RELEASE_NOTES.md" ]; then
            echo "path=releases/${GITHUB_REF_NAME}/RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"
          else
            echo "path=CHANGELOG.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            assets/logo.svg
            assets/logo.png
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
